<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Razorpay Checkout Simulator</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700&display=swap');

        :root {
            --bg-color: #f4f8fb;
            --card-bg: #ffffff;
            --text-primary: #0d2366; /* Razorpay Navy */
            --text-secondary: #5a6b87;
            --primary: #3395ff; /* Razorpay Blue */
            --primary-hover: #2183ea;
            --success: #00ca72;
            --danger: #f55b5b;
            --warning: #f19f18;
            --border-color: #e2e8f0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Mulish', 'Segoe UI', sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 40px 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
            position: relative;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 8px;
            color: var(--text-primary);
            text-align: center;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            text-align: center;
            margin-bottom: 35px;
        }

        .section-title {
            font-size: 12px;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .ip-input-group {
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 13px;
            color: var(--text-primary);
            font-weight: 600;
        }

        select {
            width: 100%;
            padding: 14px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background-color: #fafbfc;
            color: var(--text-primary);
            font-size: 14px;
            font-family: 'Mulish', sans-serif;
            outline: none;
            box-sizing: border-box;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 1px var(--primary);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 30px;
        }

        button {
            padding: 14px;
            font-size: 13px;
            font-family: 'Mulish', sans-serif;
            font-weight: 700;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:active {
            transform: translateY(1px);
        }

        .btn-normal {
            background-color: var(--primary);
            grid-column: span 2;
        }

        .btn-normal:hover {
            background-color: var(--primary-hover);
        }

        .btn-warning {
            background-color: var(--warning);
        }

        .btn-warning:hover {
            background-color: #df9012;
        }

        .btn-error {
            background-color: var(--danger);
        }

        .btn-error:hover {
            background-color: #e54c4c;
        }
        
        .btn-purple {
            background-color: #6a40ef;
            grid-column: span 2;
        }
        
        .btn-purple:hover {
            background-color: #552bd3;
        }
        
        .btn-reset {
            background-color: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            grid-column: span 2;
        }
        
        .btn-reset:hover {
            background-color: #f1f5f9;
            color: var(--text-primary);
        }

        .console {
            background-color: #fafbfc;
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 4px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            min-height: 120px;
            max-height: 200px;
            overflow-y: auto;
            color: var(--text-primary);
        }

        .console-entry {
            margin-bottom: 6px;
            border-left: 3px solid var(--primary);
            padding-left: 10px;
        }

        .console-entry.success {
            border-left-color: var(--success);
            color: #0b804b;
        }

        .console-entry.error {
            border-left-color: var(--danger);
            color: var(--danger);
        }

        .console-entry.warning {
            border-left-color: var(--warning);
            color: #bc790a;
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>E-Commerce Checkout Simulator 🛒</h1>
        <div class="subtitle">Simulate checkout transactions across multiple payment gateways.</div>

        <div class="ip-input-group">
            <label for="ipAddress">Select Client IP Address</label>
            <select id="ipAddress">
                <option value="192.168.1.15">192.168.1.15 (Normal Customer)</option>
                <option value="10.0.0.45">10.0.0.45 (Suspected Fraud Ring - VPN)</option>
                <option value="198.51.100.22">198.51.100.22 (External Customer)</option>
            </select>
        </div>

        <div>
            <div class="section-title">Log Actions</div>
            <div class="grid">
                <button class="btn-normal" onclick="trigger('normal')">Generate Normal Transactions (Healthy)</button>
                <button class="btn-error" onclick="trigger('hdfc_downtime')">Simulate HDFC Downtime (5xx)</button>
                <button class="btn-warning" onclick="trigger('sbi_latency')">Simulate SBI High Latency</button>
                <button class="btn-purple" onclick="trigger('fraud_spike')">Simulate Fraud Spike</button>
                <button class="btn-reset" onclick="resetSystemLogs()">RESET ALL LOGS & AI STATE</button>
            </div>


            <div class="section-title">Transaction Log Stream</div>
            <div class="console" id="console">
                <div class="console-entry">[SYSTEM] Simulator Ready. Clicks will trigger POST /checkout requests.</div>
            </div>
        </div>
    </div>

    <script>
        function logToConsole(message, status = 'info') {
            const consoleBox = document.getElementById('console');
            const entry = document.createElement('div');
            entry.className = `console-entry ${status}`;
            
            const time = new Date().toLocaleTimeString();
            entry.innerText = `[${time}] ${message}`;
            
            consoleBox.appendChild(entry);
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }

        function trigger(actionType) {
            const ip = document.getElementById('ipAddress').value;
            
            logToConsole(`Triggering '${actionType}' checkout request from ${ip}...`, 'info');
            
            fetch('/api/trigger', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    type: actionType,
                    ip: ip
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    logToConsole(`SUCCESS: Transaction log sent to backend.`, 'success');
                } else {
                    logToConsole(`ERROR: ${data.message || JSON.stringify(data)}`, 'error');
                }
            })
            .catch(err => {
                logToConsole(`CONNECTION ERROR: Make sure backend FastAPI is running.`, 'error');
            });
        }

        function resetSystemLogs() {
            fetch('/api/reset')
            .then(res => res.json())
            .then(data => {
                logToConsole(`[RESET] ${data.message}`, 'success');
            })
            .catch(err => {
                logToConsole(`[ERROR] Could not reset system: ${err}`, 'error');
            });
        }
    </script>
</body>
</html>
